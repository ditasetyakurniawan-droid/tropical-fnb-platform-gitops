# Default values for tropical-fnb Helm chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  environment: production # development | staging | production

backend:
  replicaCount: 2
  image:
    repository: harbor-dt.co.id/devops-apps/tropical-fnb-backend
    pullPolicy: IfNotPresent
    tag: "1.0.0" # backend-tag
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi
  env:
    APP_ENV: "production"
    LOG_LEVEL: "info"
    HTTP_ADDR: ":8080"
    HTTP_READ_TIMEOUT: "15s"
    HTTP_WRITE_TIMEOUT: "30s"
    HTTP_IDLE_TIMEOUT: "120s"
    SHUTDOWN_TIMEOUT: "20s"
    DB_MAX_CONNS: "20"
    DB_MIN_CONNS: "2"
    CORS_ALLOWED_ORIGINS: "https://tropical.yourdomain.com"
  # In Kubernetes, sensitive variables come from Secrets
  secrets:
    # Set to true if managing the Secret resource inside this Helm chart
    createSecret: true
    # Connection string for PostgreSQL 18 via external headless service db-tropical
    databaseUrl: "postgres://fnb_user:TropicalFnb2026!@db-tropical:5432/tropical_fnb_db?sslmode=disable"
    jwtSecret: "TropicalFnb2026SuperSecureJwtTokenSecretKeyAtLeast32Chars!"

# External Database mapping (node 192.168.100.70 DB-dt)
externalDatabase:
  enabled: true
  serviceName: "db-tropical"
  host: "192.168.100.70"
  port: 5432

frontend:
  replicaCount: 2
  image:
    repository: harbor-dt.co.id/devops-apps/tropical-fnb-frontend
    pullPolicy: IfNotPresent
    tag: "1.0.0" # frontend-tag
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 32Mi
  env:
    # Injected into config.js dynamically at container startup (no rebuild needed!)
    # Empty string = same origin (when behind Ingress routing /api to backend)
    API_BASE_URL: ""

migration:
  # Runs goose schema migrations as a Helm pre-upgrade / pre-install hook Job
  enabled: true
  image:
    repository: harbor-dt.co.id/devops-apps/tropical-fnb-backend
    pullPolicy: IfNotPresent
    tag: "1.0.0" # backend-tag

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
  hosts:
    - host: tropical.yourdomain.com
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: tropical-fnb-tls
      hosts:
        - tropical.yourdomain.com
