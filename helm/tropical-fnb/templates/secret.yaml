{{- if .Values.backend.secrets.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tropical-fnb.fullname" . }}-secrets
  labels:
    {{- include "tropical-fnb.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.backend.secrets.databaseUrl | quote }}
  JWT_SECRET: {{ .Values.backend.secrets.jwtSecret | quote }}
{{- end }}
