apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tropical-fnb.fullname" . }}-config
  labels:
    {{- include "tropical-fnb.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.backend.env.APP_ENV | quote }}
  LOG_LEVEL: {{ .Values.backend.env.LOG_LEVEL | quote }}
  HTTP_ADDR: {{ .Values.backend.env.HTTP_ADDR | quote }}
  HTTP_READ_TIMEOUT: {{ .Values.backend.env.HTTP_READ_TIMEOUT | quote }}
  HTTP_WRITE_TIMEOUT: {{ .Values.backend.env.HTTP_WRITE_TIMEOUT | quote }}
  HTTP_IDLE_TIMEOUT: {{ .Values.backend.env.HTTP_IDLE_TIMEOUT | quote }}
  SHUTDOWN_TIMEOUT: {{ .Values.backend.env.SHUTDOWN_TIMEOUT | quote }}
  DB_MAX_CONNS: {{ .Values.backend.env.DB_MAX_CONNS | quote }}
  DB_MIN_CONNS: {{ .Values.backend.env.DB_MIN_CONNS | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.backend.env.CORS_ALLOWED_ORIGINS | quote }}
  API_BASE_URL: {{ .Values.frontend.env.API_BASE_URL | quote }}
